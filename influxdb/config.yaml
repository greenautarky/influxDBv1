---
name: ga_InfluxDBv1
version: 1.0.0
slug: ga_influxdbv1
description: Scalable datastore for metrics, events, and real-time analytics
url: https://github.com/hassio-addons/addon-influxdb
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:chart-areaspline
startup: services
homeassistant: 0.92.0b2
hassio_api: true
arch:
  - aarch64
  - amd64
  - armv7
init: false
map:
  # share:rw is kept for ONE release, and for one reason: the provisioning step
  # deletes the shared-secret file this add-on used to mirror there. Removing
  # the mount in the same release would turn that deletion into a silent no-op
  # on every already-deployed device. Scheduled for removal in 1.1.0 once the
  # canaries confirm the file is gone.
  - share:rw
  - ssl
ports:
  # Nothing outside this device needs to reach InfluxDB directly. Consumers on
  # the device reach it by its container name on the add-on network, which is
  # what the credential manifest hands them — verified from Home Assistant
  # Core's own network view, which resolves and reaches
  # 99f1cad4-ga-influxdbv1:8086 without any host publish.
  #
  # 8088 in particular: in InfluxDB 1.x the RPC service used for backup and
  # restore has NO authentication concept at all — `auth-enabled` covers the
  # HTTP API on 8086 and nothing else. Publishing it on every host interface
  # therefore offers a full database export to anything that can open the
  # port, which is a much larger door than the one 8086 leaves ajar.
  80/tcp: null
  8086/tcp: null
  8088/tcp: null
ports_description:
  80/tcp: Web interface (Not required for Ingress)
  8086/tcp: InfluxDB server (not published — reachable on the add-on network)
  8088/tcp: RPC backup/restore (not published — unauthenticated by design in 1.x)
auth_api: true
options:
  auth: true
  # NOTE: `per_user_secrets` is gone in 1.0.0. It selected between the shared
  # secret and the per-consumer model; the shared secret no longer exists, so
  # the flag had one setting left. One user per consumer is now the only mode,
  # and the major version is the signal. Rolling back is a version pin, not a
  # config toggle — which is the honest mechanism, because the two modes write
  # different credentials and a toggle made that look reversible in place.
  reporting: true
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  # optimized for resource-constrained devices
  envvars:
    - name: INFLUXDB_REPORTING_DISABLED
      value: "true"
    - name: INFLUXDB_DATA_CACHE_MAX_MEMORY_SIZE
      value: "64m"
    - name: INFLUXDB_DATA_MAX_WAL_SIZE
      value: "16m"
    - name: INFLUXDB_DATA_WAL_FSYNC_DELAY
      value: "100ms"
    - name: INFLUXDB_DATA_TSM_USE_MADV_WILLNEED
      value: "false"
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  auth: bool
  reporting: bool
  ssl: bool
  certfile: str
  keyfile: str
  envvars:
    - name: match(^INFLUXDB_([A-Z0-9_])+$)
      value: str
  leave_front_door_open: bool?
image: ghcr.io/greenautarky/ga_influxdbv1-{arch}
